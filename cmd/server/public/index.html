<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joker — 9-max</title>
<style>
  :root {
    --felt: #1e7a45;
    --felt-hi: #2f9a58;
    --felt-lo: #0e4f2c;
    --rail: #7a4a24;
    --rail-hi: #b07a42;
    --rail-lo: #3d2110;
    --brass: #d4b36a;
    --gold: #ffd24a;
    --ink: #f4f1e6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    color: var(--ink);
    font-family: Tahoma, Verdana, "Segoe UI", sans-serif;
    background: #0b2a38;
  }

  /* Iconic Full Tilt “beach” room, CSS-only. */
  .room {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg,
        #8fd4f0 0%,
        #6ec0e6 22%,
        #3a9cc8 38%,
        #1e7aa8 46%,
        #15688f 54%,
        #c9a56a 58%,
        #e0c48a 78%,
        #d2b074 100%);
  }
  .room::before {
    content: "";
    position: absolute; left: -40px; top: 8%; width: 220px; height: 280px;
    background:
      radial-gradient(ellipse at 70% 20%, #1a5c28 0 18%, transparent 19%),
      radial-gradient(ellipse at 40% 28%, #164e22 0 16%, transparent 17%),
      radial-gradient(ellipse at 55% 8%, #1d6a2e 0 14%, transparent 15%);
    clip-path: polygon(60% 0, 78% 38%, 70% 38%, 72% 100%, 52% 100%, 54% 40%, 46% 40%);
    opacity: .55; pointer-events: none;
  }
  .room::after {
    content: "";
    position: absolute; right: -20px; top: 12%; width: 180px; height: 240px;
    background:
      radial-gradient(ellipse at 30% 18%, #1a5c28 0 16%, transparent 17%),
      radial-gradient(ellipse at 60% 30%, #164e22 0 14%, transparent 15%);
    clip-path: polygon(40% 0, 28% 36%, 36% 36%, 34% 100%, 52% 100%, 50% 38%, 58% 38%);
    opacity: .45; pointer-events: none;
  }

  .chrome {
    position: relative; z-index: 8;
    height: 34px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px;
    background: linear-gradient(#4a4a4a, #1a1a1a);
    border-bottom: 1px solid #000;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    font-size: 12px; letter-spacing: .06em;
  }
  .chrome .brand { font-style: italic; font-weight: 800; color: #e23b3b; letter-spacing: .14em; font-size: 15px; }
  .chrome .meta { color: #ddd; }
  .chrome .meta span { color: #f0d56a; }
  .chrome button {
    background: linear-gradient(#5a5a5a, #2a2a2a); color: #eee;
    border: 1px solid #111; border-radius: 3px; padding: 4px 12px;
    cursor: pointer; font: 700 11px Tahoma, sans-serif; text-transform: uppercase;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .chrome button:hover { filter: brightness(1.12); }

  .stage { position: relative; height: calc(100% - 34px - 122px); z-index: 2; }

  .table-wrap {
    position: absolute; inset: 3% 5% 10% 5%;
  }
  .rail {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, var(--rail-hi) 0%, var(--rail) 42%, var(--rail-lo) 100%);
    border-radius: 50% / 46%;
    box-shadow:
      0 28px 50px rgba(0,0,0,.45),
      0 8px 18px rgba(80,40,10,.35),
      inset 0 4px 0 rgba(255,220,160,.28),
      inset 0 -10px 18px rgba(0,0,0,.4);
    padding: 26px;
  }
  .rail::before {
    content: "";
    position: absolute; inset: 10px;
    border-radius: 50% / 46%;
    border: 2px dashed rgba(255, 210, 140, .28);
    pointer-events: none;
  }
  .brass {
    height: 100%;
    border-radius: 50% / 46%;
    padding: 9px;
    box-shadow:
      inset 0 0 0 4px var(--brass),
      inset 0 0 0 7px #5a3a16;
  }
  .felt {
    position: relative; height: 100%;
    background:
      radial-gradient(ellipse at 50% 40%, #3aaa62 0%, var(--felt-hi) 26%, var(--felt) 58%, var(--felt-lo) 100%);
    border-radius: 50% / 46%;
    box-shadow: inset 0 0 80px rgba(0,0,0,.28);
    overflow: hidden;
  }
  .felt-ring {
    position: absolute; inset: 11% 13%;
    border: 2px solid rgba(232, 214, 150, .28);
    border-radius: 50% / 46%;
    pointer-events: none;
  }
  .watermark {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) rotate(-8deg);
    font: italic 800 clamp(72px, 10vw, 128px) Georgia, "Times New Roman", serif;
    color: rgba(255,255,255,.08); letter-spacing: .2em;
    text-shadow: 0 1px 0 rgba(0,0,0,.18), 0 -1px 0 rgba(255,255,255,.06);
    pointer-events: none; user-select: none; z-index: 1;
    white-space: nowrap;
  }
  .center {
    position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
    text-align: center; z-index: 2; width: 70%;
  }
  .pot-label {
    color: #fff; font-size: 16px; font-weight: 700;
    text-shadow: 0 1px 3px #000;
    background: rgba(0,0,0,.32);
    display: inline-block; padding: 3px 14px; border-radius: 12px;
    border: 1px solid rgba(255,210,100,.25);
  }
  .pot-piles {
    display: flex; justify-content: center; align-items: flex-end; gap: 16px;
    margin: 6px 0 2px; min-height: 0;
  }
  .pot-pile {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .pot-pile .chip-stack { height: 34px; }
  .pot-pile .chip-col { height: 34px; width: 28px; }
  .pot-pile .chip { width: 28px; height: 18px; }
  .pot-pile .chip svg { width: 28px; height: 18px; }
  .pot-pile .lab {
    font-size: 11px; font-weight: 700; color: #ffe9a0;
    text-shadow: 0 1px 2px #000;
    background: rgba(0,0,0,.42);
    padding: 1px 8px; border-radius: 8px;
    border: 1px solid rgba(196,163,90,.5);
  }
  .pot-pile .who {
    font-size: 9px; color: #d5e8d8; max-width: 96px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-shadow: 0 1px 2px #000;
  }
  .street {
    color: #e8f6e8; font-size: 11px; margin-top: 5px;
    letter-spacing: .14em; text-transform: uppercase; text-shadow: 0 1px 2px #000;
  }
  .board { display: flex; justify-content: center; gap: 12px; margin-top: 10px; min-height: 92px; }
  .card.deal { animation: dealIn .38s ease-out; }
  @keyframes dealIn {
    from { transform: translateY(-16px) scale(.82); opacity: 0; }
    to { transform: none; opacity: 1; }
  }

  .card {
    width: 58px; height: 82px;
    background: #fffef8;
    border-radius: 4px;
    box-shadow: 0 2px 5px rgba(0,0,0,.45), inset 0 0 0 1px #cfc6b4;
    position: relative; color: #161616; overflow: hidden;
    font-family: Palatino, "Palatino Linotype", Georgia, serif;
  }
  .card.red { color: #c41212; }
  .card .idx {
    position: absolute; top: 2px; left: 3px; z-index: 2;
    display: flex; flex-direction: column; align-items: center;
    width: 16px; line-height: .92; font-weight: 800; font-size: 13px;
  }
  .card .idx .suit { font-size: 10px; font-weight: 400; }
  .card .idx.bot {
    top: auto; bottom: 2px; left: auto; right: 3px;
    transform: rotate(180deg);
  }
  .card .pips { position: absolute; inset: 0; }
  .card .pip {
    position: absolute; transform: translate(-50%, -50%);
    font-size: 15px; line-height: 1;
  }
  .card .pip.flip { transform: translate(-50%, -50%) rotate(180deg); }
  .card .pip.ace { font-size: 34px; }
  .card .court {
    position: absolute; inset: 16% 20%;
    border: 1.4px solid currentColor; border-radius: 2px;
    background: linear-gradient(#fff, #f3ead8);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .card .court-letter { font-size: 22px; font-weight: 800; line-height: 1; }
  .card .court-suit { font-size: 13px; }
  .card.back {
    background: #7a1418; color: #e8c56a; padding: 3px;
    box-shadow: 0 2px 5px rgba(0,0,0,.45);
  }
  .card.back .back-face {
    height: 100%; border-radius: 2px; border: 1.5px solid #e6c56a;
    background:
      repeating-linear-gradient(45deg, #9c1c22 0 5px, #6a1014 5px 10px),
      repeating-linear-gradient(-45deg, #9c1c22 0 5px, #6a1014 5px 10px);
    display: flex; align-items: center; justify-content: center; font-size: 13px;
  }
  .card.sm { width: 30px; height: 42px; }
  .card.sm .idx { font-size: 8px; width: 10px; top: 1px; left: 1px; }
  .card.sm .idx .suit { font-size: 7px; }
  .card.sm .idx.bot { display: none; }
  .card.sm .pip { font-size: 8px; }
  .card.sm .pip.ace { font-size: 16px; }
  .card.sm .court { inset: 18% 22% 12% 22%; }
  .card.sm .court-letter { font-size: 11px; }
  .card.sm .court-suit { font-size: 8px; }
  .card.sm.back { padding: 2px; }
  .card.sm.back .back-face { font-size: 8px; border-width: 1px; }

  .seat {
    position: absolute; width: 124px; margin-left: -62px; margin-top: -62px;
    z-index: 5; text-align: center; pointer-events: none;
  }
  .avatar {
    width: 70px; height: 70px; margin: 0 auto;
    border-radius: 50%;
    border: 3px solid #e8c56a;
    box-shadow: 0 0 0 2px #6a4a18, 0 3px 6px #000;
    overflow: hidden; background: #2a2a32;
    position: relative;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; transform: scale(1.12); display: block; }
  .seat.hero .avatar { border-color: #fff; box-shadow: 0 0 0 2px #c41212, 0 2px 6px #000; }
  .seat.to-act .avatar {
    box-shadow: 0 0 0 3px #ffd24a, 0 0 18px #ffd24a;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px #ffd24a, 0 0 10px #ffd24a; }
    50% { box-shadow: 0 0 0 5px #ffe9a0, 0 0 22px #ffd24a; }
  }
  .seat.folded { opacity: .4; filter: grayscale(.55); }
  .seat.allin .nameplate { border-color: #e23b3b; }
  .seat.winner .avatar {
    box-shadow: 0 0 0 4px #ffd24a, 0 0 22px #ffd24a;
    animation: winpulse .7s ease-in-out infinite;
  }
  .seat.winner .nameplate {
    border-color: #ffd24a;
    box-shadow: 0 0 10px rgba(255,210,74,.7);
    background: #2a2208;
  }
  @keyframes winpulse {
    0%, 100% { box-shadow: 0 0 0 3px #ffd24a, 0 0 10px #ffd24a; }
    50% { box-shadow: 0 0 0 6px #ffe9a0, 0 0 26px #ffd24a; }
  }
  .win-banner:empty { display: none; }
  .win-banner {
    position: absolute; left: 50%; top: 64%; z-index: 12;
    transform: translate(-50%, -50%);
    background: linear-gradient(#3a3420, #16140c);
    border: 2px solid #ffd24a; color: #ffd24a;
    font: 800 20px Tahoma, sans-serif;
    padding: 10px 24px; border-radius: 8px; text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,.55);
    animation: winpop .4s ease-out;
    pointer-events: none; white-space: nowrap;
  }
  .win-banner .sub { display: block; color: #f3f0e6; font-size: 13px; font-weight: 600; margin-top: 4px; }
  @keyframes winpop {
    from { transform: translate(-50%, -50%) scale(.55); opacity: 0; }
    to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  .nameplate {
    margin-top: 3px; background: #0a0a0a;
    border: 1px solid #c4a35a; border-radius: 3px;
    padding: 3px 7px; box-shadow: 0 2px 5px #000;
  }
  .nameplate .name {
    font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #f2f2f2;
  }
  .nameplate .stack { color: var(--gold); font-size: 13px; font-weight: 700; }
  .nameplate .hand { color: #9f9; font-size: 10px; }
  .nameplate .tag { color: #f66; font-size: 10px; font-weight: 800; letter-spacing: .06em; }
  .hole { display: flex; gap: 2px; justify-content: center; margin-top: 3px; }

  .bet {
    position: absolute; z-index: 4; transform: translate(-50%, -50%);
    display: flex; flex-direction: column; align-items: center; gap: 1px;
  }
  .chip-stack {
    display: flex; align-items: flex-end; justify-content: center; gap: 3px;
    height: 48px;
  }
  .chip-col {
    position: relative; width: 34px; height: 48px;
  }
  .chip-col:nth-child(2) { transform: rotate(4deg); margin-bottom: 1px; }
  .chip-col:nth-child(3) { transform: rotate(-5deg); }
  .chip {
    position: absolute; left: 0; width: 34px; height: 22px;
    bottom: calc(var(--i, 0) * 5px);
    z-index: calc(var(--i, 0) + 1);
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.55));
  }
  .chip svg { display: block; width: 34px; height: 22px; }
  .chip-amt {
    background: rgba(0,0,0,.62); color: var(--gold);
    font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 8px;
    border: 1px solid #c4a35a; text-shadow: 0 1px 1px #000;
  }

  .dealer, .blind-tag {
    position: absolute; z-index: 6; width: 26px; height: 26px; margin: -13px 0 0 -13px;
    border-radius: 50%;
    font-weight: 900; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 4px #000; border: 1px solid #fff6;
  }
  .dealer {
    background: radial-gradient(circle at 32% 28%, #fff3c0, #e6b422 55%, #b8860b);
    color: #2a1c00; font-size: 13px;
  }
  .blind-tag.sb {
    background: radial-gradient(circle at 32% 28%, #ffe08a, #f0b430 55%, #c48410);
    color: #2a1c00;
  }
  .blind-tag.bb {
    background: radial-gradient(circle at 32% 28%, #b8e4ff, #4aa8e0 55%, #1a6aa8);
    color: #0a2438;
  }

  #overlays {
    position: absolute; inset: 0; z-index: 5; pointer-events: none;
  }
  .hero-cards {
    position: absolute; left: 50%; bottom: 11%; transform: translateX(-50%);
    display: flex; gap: 6px; z-index: 7;
  }
  .hero-cards.folded { opacity: .4; filter: grayscale(.55); }
  .hero-cards .card {
    width: 78px; height: 110px;
    transform: rotate(var(--rot, 0deg));
    box-shadow: 0 6px 12px rgba(0,0,0,.5), inset 0 0 0 1px #cfc4ae;
  }
  .hero-cards .card .idx { font-size: 18px; width: 22px; top: 3px; left: 4px; }
  .hero-cards .card .idx .suit { font-size: 14px; }
  .hero-cards .card .pip { font-size: 20px; }
  .hero-cards .card .pip.ace { font-size: 46px; }
  .hero-cards .card .court-letter { font-size: 32px; }
  .hero-cards .card .court-suit { font-size: 18px; }
  .hero-cards .card:first-child { --rot: -6deg; margin-right: -4px; }
  .hero-cards .card:last-child { --rot: 6deg; }

  .bar {
    position: relative; z-index: 8;
    height: 122px;
    background: linear-gradient(#3a3a3a, #161616);
    border-top: 2px solid #5a5a5a;
    display: grid; grid-template-columns: 240px 1fr 300px;
    gap: 12px; padding: 10px 14px;
    box-shadow: 0 -8px 18px rgba(0,0,0,.35);
  }
  .log {
    overflow: auto; background: #0c0c0c; border: 1px solid #3a3a3a;
    font-size: 11px; color: #c8e0c0; padding: 6px 8px; line-height: 1.4;
    border-radius: 2px;
  }
  .log div:first-child { color: #ffe08a; }
  .actions { display: flex; align-items: stretch; gap: 10px; height: 72px; }
  .actions button {
    flex: 1; font: 800 18px Tahoma, sans-serif; cursor: pointer; border-radius: 6px;
    border: 1px solid #111; color: #fff;
    text-shadow: 0 1px 1px rgba(0,0,0,.45);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -3px 0 rgba(0,0,0,.25), 0 3px 0 #000;
  }
  .actions button:hover:not(:disabled) { filter: brightness(1.08); }
  .actions button:active:not(:disabled) { transform: translateY(1px); }
  .actions button:disabled { opacity: .28; cursor: default; filter: grayscale(.45); }
  .btn-fold { background: linear-gradient(#e07038, #a83810); }
  .btn-call { background: linear-gradient(#4cb85a, #1e7a30); }
  .btn-raise { background: linear-gradient(#4aa0e0, #1a5a9a); }
  .sizing { display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  .sizing input[type=range] { width: 100%; accent-color: #d4b36a; }
  .sizing .row { display: flex; gap: 4px; }
  .sizing .row button, .sizing input[type=number] {
    flex: 1; background: linear-gradient(#3a3a3a, #222);
    color: #eee; border: 1px solid #555; border-radius: 3px;
    font: 700 11px Tahoma, sans-serif; padding: 5px 2px; cursor: pointer;
  }
  .sizing input[type=number] { flex: 1.2; cursor: text; text-align: center; }
  .err { color: #f66; font-size: 12px; min-height: 1.1em; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="room">
  <div class="chrome">
    <div class="meta"><span class="brand">JOKER</span> &nbsp; No-Limit Hold'em &nbsp; <span>50/100</span> &nbsp; 9-max</div>
    <button id="newGame">New Table</button>
  </div>
  <div class="stage">
    <div class="table-wrap" id="tableWrap">
      <div class="rail">
        <div class="brass">
          <div class="felt" id="felt">
            <div class="felt-ring"></div>
            <div class="watermark" aria-hidden="true">JOKER</div>
            <div class="center">
              <div class="pot-label" id="pot">Pot 0</div>
              <div class="pot-piles" id="potPiles"></div>
              <div class="street" id="street"></div>
              <div class="board" id="board"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="overlays"></div>
      <div class="hero-cards" id="heroCards"></div>
      <div id="winBanner" class="win-banner"></div>
    </div>
  </div>
  <div class="bar">
    <div class="log" id="log"></div>
    <div>
      <div class="err" id="err"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="sizing">
      <input id="slider" type="range" min="0" max="10000" step="50" value="200"/>
      <div class="row">
        <button data-size="min">Min</button>
        <button data-size="pot2">½ pot</button>
        <button data-size="pot">Pot</button>
        <button data-size="allin">All-in</button>
        <input id="amount" type="number" min="0" step="50" value="200"/>
      </div>
    </div>
  </div>
</div>
<script src="wasm_exec.js"></script>
<script>
const go = new Go();
let state = null;
let timer = null;

/* 9-max racetrack: hero at bottom, increasing seats to hero's left
   (screen-left). That matches clockwise table action. */
const SEATS = [
  {l:50, t:94}, {l:22, t:86}, {l:4, t:58}, {l:12, t:24}, {l:34, t:7},
  {l:66, t:7}, {l:88, t:24}, {l:96, t:58}, {l:78, t:86}
];
const BETS = [
  {l:50, t:73}, {l:32, t:69}, {l:21, t:54}, {l:27, t:34}, {l:40, t:23},
  {l:60, t:23}, {l:73, t:34}, {l:79, t:54}, {l:68, t:69}
];
const DPOS = [
  {l:42, t:80}, {l:28, t:76}, {l:14, t:50}, {l:20, t:30}, {l:38, t:16},
  {l:62, t:16}, {l:80, t:30}, {l:86, t:50}, {l:72, t:76}
];
const AVATARS = [
  "avatars/avatar-astronaut.webp",
  "avatars/avatar-robot.webp",
  "avatars/avatar-dragon-red.webp",
  "avatars/avatar-dragon-green.webp",
  "avatars/avatar-wizard.webp",
  "avatars/avatar-pirate.webp",
  "avatars/avatar-alien.webp",
  "avatars/avatar-ninja.webp",
  "avatars/avatar-knight.webp",
  "avatars/avatar-fox.webp"
];
function avatarEl(seat) {
  const src = AVATARS[seat % AVATARS.length];
  return `<img src="${src}" alt="" width="70" height="70"/>`;
}

function splitCard(s) {
  if (!s) return { r: "", su: "", red: false };
  const r = s[0] === "T" ? "10" : s[0];
  const su = s.slice(1);
  return { r, su, red: su === "♥" || su === "♦" };
}
const PIP_LAYOUT = {
  A:  [[50, 50]],
  2:  [[50, 24], [50, 76]],
  3:  [[50, 24], [50, 50], [50, 76]],
  4:  [[32, 24], [68, 24], [32, 76], [68, 76]],
  5:  [[32, 24], [68, 24], [50, 50], [32, 76], [68, 76]],
  6:  [[32, 24], [68, 24], [32, 50], [68, 50], [32, 76], [68, 76]],
  7:  [[32, 22], [68, 22], [50, 36], [32, 50], [68, 50], [32, 78], [68, 78]],
  8:  [[32, 22], [68, 22], [50, 36], [32, 50], [68, 50], [50, 64], [32, 78], [68, 78]],
  9:  [[32, 20], [68, 20], [32, 40], [68, 40], [50, 50], [32, 60], [68, 60], [32, 80], [68, 80]],
  10: [[32, 18], [68, 18], [50, 30], [32, 38], [68, 38], [32, 62], [68, 62], [50, 70], [32, 82], [68, 82]]
};
function cardEl(s, small) {
  const d = document.createElement("div");
  if (s === "back") {
    d.className = "card back" + (small ? " sm" : "");
    d.innerHTML = `<div class="back-face">◆</div>`;
    return d;
  }
  const { r, su, red } = splitCard(s);
  d.className = "card" + (red ? " red" : "") + (small ? " sm" : "");
  const idx = `<div class="idx"><span class="rk">${r}</span><span class="suit">${su}</span></div>
    <div class="idx bot"><span class="rk">${r}</span><span class="suit">${su}</span></div>`;
  if (r === "J" || r === "Q" || r === "K") {
    d.innerHTML = idx + `<div class="court"><span class="court-letter">${r}</span><span class="court-suit">${su}</span></div>`;
    return d;
  }
  const pips = (PIP_LAYOUT[r] || PIP_LAYOUT.A).map(([x, y]) => {
    const cls = "pip" + (r === "A" ? " ace" : "") + (y > 52 ? " flip" : "");
    return `<span class="${cls}" style="left:${x}%;top:${y}%">${su}</span>`;
  }).join("");
  d.innerHTML = idx + `<div class="pips">${pips}</div>`;
  return d;
}
function parse(raw) {
  try { return JSON.parse(raw); } catch (e) { return { error: String(raw) }; }
}
function fmt(n) { return Number(n || 0).toLocaleString(); }
function heroPlayer(s) {
  return (s.players || []).find(x => x.seat === s.hero);
}
function heroStack(s) {
  const p = heroPlayer(s);
  return p ? p.chips : 0;
}
function heroPut(s) {
  const p = heroPlayer(s);
  return p ? (p.streetPut || 0) : 0;
}
function wantsAllIn(s, amt) {
  const legal = new Set(s.legal || []);
  if (!legal.has("allin")) return false;
  const stack = heroStack(s);
  const put = heroPut(s);
  if (!legal.has("bet") && !legal.has("raise")) return true;
  return amt >= stack || amt >= put + stack;
}
function sizingMax(s) {
  const legal = new Set(s.legal || []);
  const stack = heroStack(s);
  if (legal.has("raise")) return heroPut(s) + stack;
  return stack;
}
const CHIP_PAL = {
  white:  ["#f4f4f4", "#8e8e8e", "#c41212"],
  red:    ["#e22222", "#8c1010", "#ffffff"],
  green:  ["#22a048", "#0e5c28", "#ffffff"],
  blue:   ["#2a7ad4", "#134a8a", "#ffffff"],
  black:  ["#2a2a2a", "#0a0a0a", "#f2f2f2"],
  purple: ["#8a38c8", "#4e1a78", "#ffffff"],
  yellow: ["#f0cc22", "#b07810", "#ffffff"],
  orange: ["#f07818", "#a04808", "#ffffff"]
};
function chipSVG(color) {
  const [body, edge, spot] = CHIP_PAL[color] || CHIP_PAL.red;
  const spots = Array.from({length: 8}, (_, i) => {
    const a = (i / 8) * Math.PI * 2 + 0.18;
    const x = (20 + Math.cos(a) * 14.4).toFixed(1);
    const y = (10.4 + Math.sin(a) * 7.3).toFixed(1);
    return `<ellipse cx="${x}" cy="${y}" rx="2.2" ry="1.4" fill="${spot}"/>`;
  }).join("");
  return `<svg viewBox="0 0 40 26" aria-hidden="true">
    <ellipse cx="20" cy="16.2" rx="17.6" ry="9" fill="${edge}"/>
    <ellipse cx="20" cy="10.4" rx="17.6" ry="9" fill="${body}"/>
    ${spots}
    <ellipse cx="20" cy="10.4" rx="9.6" ry="5" fill="none" stroke="${spot}" stroke-width="1.4"/>
    <ellipse cx="20" cy="8.8" rx="13" ry="4.6" fill="#fff" opacity=".16"/>
  </svg>`;
}
function chipPile(amount) {
  const denoms = [
    [5000, "orange"], [1000, "yellow"], [500, "purple"],
    [100, "black"], [50, "blue"], [25, "green"], [5, "red"], [1, "white"]
  ];
  let left = Math.max(0, amount | 0);
  const colors = [];
  for (const [v, cls] of denoms) {
    while (left >= v && colors.length < 12) {
      colors.push(cls);
      left -= v;
    }
  }
  if (!colors.length) colors.push("white");
  const perCol = 4;
  const cols = [];
  colors.forEach((cls, i) => {
    const c = Math.floor(i / perCol);
    if (!cols[c]) cols[c] = [];
    cols[c].push(cls);
  });
  return cols.map(col => {
    const chips = col.map((cls, i) =>
      `<div class="chip" style="--i:${i}">${chipSVG(cls)}</div>`).join("");
    return `<div class="chip-col">${chips}</div>`;
  }).join("");
}

function renderPots(s) {
  const el = document.getElementById("potPiles");
  el.innerHTML = "";
  const pots = s.pots || [];
  if (pots.length < 2) return;
  const names = {};
  (s.players || []).forEach(p => {
    names[p.seat] = p.seat === s.hero ? "You" : p.id;
  });
  let mainSeen = false;
  let sideN = 0;
  pots.forEach(sp => {
    const n = (sp.eligible || []).length;
    let title = "Main";
    if (n <= 1) title = "Uncalled";
    else if (mainSeen) {
      sideN++;
      title = sideN === 1 ? "Side" : "Side " + sideN;
    } else {
      mainSeen = true;
    }
    const who = (sp.eligible || []).map(seat => names[seat] || ("Seat " + seat)).join(", ");
    const d = document.createElement("div");
    d.className = "pot-pile";
    d.innerHTML = `<div class="chip-stack">${chipPile(sp.amount)}</div>
      <div class="lab">${title}  ${fmt(sp.amount)}</div>
      <div class="who">${who}</div>`;
    el.appendChild(d);
  });
}

function render(s) {
  state = s;
  document.getElementById("err").textContent = s.error || "";
  document.getElementById("pot").textContent = "Pot  " + fmt(s.pot);
  renderPots(s);
  document.getElementById("street").textContent = s.street || "";
  const board = document.getElementById("board");
  board.innerHTML = "";
  (s.board || []).forEach((c, i) => {
    const el = cardEl(c, false);
    if (i >= prevBoardN) el.classList.add("deal");
    board.appendChild(el);
  });
  prevBoardN = (s.board || []).length;

  const wrap = document.getElementById("overlays");
  wrap.innerHTML = "";
  const hero = (s.players || []).find(p => p.seat === s.hero);
  const hc = document.getElementById("heroCards");
  hc.innerHTML = "";
  hc.classList.toggle("folded", !!(hero && hero.folded));
  if (hero && hero.hole && hero.hole.length) {
    hero.hole.forEach(c => hc.appendChild(cardEl(c, false)));
  }

  (s.players || []).forEach(p => {
    const pos = SEATS[p.seat] || SEATS[0];
    const el = document.createElement("div");
    el.className = "seat"
      + (p.seat === s.hero ? " hero" : "")
      + (p.seat === s.toAct ? " to-act" : "")
      + (p.folded ? " folded" : "")
      + (p.allIn ? " allin" : "")
      + (s.done && p.award > 0 ? " winner" : "");
    el.style.left = pos.l + "%";
    el.style.top = pos.t + "%";
    el.innerHTML = `
      <div class="avatar">${avatarEl(p.seat)}</div>
      <div class="nameplate">
        <div class="name">${p.id}</div>
        <div class="stack">${fmt(p.chips)}${p.award ? " +" + fmt(p.award) : ""}</div>
        ${p.allIn && !p.folded ? `<div class="tag">ALL-IN</div>` : ""}
        ${p.hand ? `<div class="hand">${p.hand}</div>` : ""}
      </div>`;
    const hole = document.createElement("div");
    hole.className = "hole";
    if (p.seat !== s.hero) {
      if (p.hole && p.hole.length) p.hole.forEach(c => hole.appendChild(cardEl(c, true)));
      else if (!p.folded && !s.done) {
        hole.appendChild(cardEl("back", true));
        hole.appendChild(cardEl("back", true));
      }
    }
    el.appendChild(hole);
    wrap.appendChild(el);

    if (p.streetPut > 0) {
      const ip = BETS[p.seat] || BETS[0];
      const b = document.createElement("div");
      b.className = "bet";
      b.style.left = ip.l + "%";
      b.style.top = ip.t + "%";
      b.innerHTML = `<div class="chip-stack">${chipPile(p.streetPut)}</div><div class="chip-amt">${fmt(p.streetPut)}</div>`;
      wrap.appendChild(b);
    }
  });

  if (s.button >= 0) {
    const bp = DPOS[s.button] || DPOS[0];
    const d = document.createElement("div");
    d.className = "dealer";
    d.textContent = "D";
    d.style.left = bp.l + "%";
    d.style.top = bp.t + "%";
    wrap.appendChild(d);
  }
  [["sb", s.sb, "SB"], ["bb", s.bb, "BB"]].forEach(([cls, seat, lab]) => {
    if (seat == null || seat < 0) return;
    const p = DPOS[seat] || DPOS[0];
    const t = document.createElement("div");
    t.className = "blind-tag " + cls;
    t.textContent = lab;
    t.style.left = (p.l + 3) + "%";
    t.style.top = (p.t + 5) + "%";
    wrap.appendChild(t);
  });

  const actions = document.getElementById("actions");
  actions.innerHTML = "";
  const heroTurn = s.toAct === s.hero && !s.done;
  const legal = new Set(s.legal || []);
  const callAmt = s.call || 0;
  const minBet = legal.has("raise") ? (s.minRaiseTo || 0) : (s.minBet || 0);
  const stack = heroStack(s);
  const cap = sizingMax(s);
  const slider = document.getElementById("slider");
  const amt = document.getElementById("amount");
  slider.step = 50;
  if (legal.has("bet") || legal.has("raise")) {
    slider.min = Math.min(minBet || 0, cap);
    slider.max = Math.max(cap, 0);
    if (Number(amt.value) < Number(slider.min)) amt.value = slider.min;
    if (Number(amt.value) > cap) amt.value = cap;
    slider.value = amt.value;
  } else if (legal.has("allin")) {
    slider.min = stack;
    slider.max = stack;
    amt.value = stack;
    slider.value = stack;
  }
  const raiseTo = Number(amt.value) || minBet;
  const mk = (typ, label, cls) => {
    const b = document.createElement("button");
    b.className = cls;
    b.textContent = label;
    b.disabled = !heroTurn || !legal.has(typ);
    b.onclick = () => act(typ);
    actions.appendChild(b);
  };
  mk("fold", "Fold", "btn-fold");
  if (legal.has("check")) mk("check", "Check", "btn-call");
  else mk("call", callAmt ? "Call " + fmt(callAmt) : "Call", "btn-call");
  if (wantsAllIn(s, raiseTo)) mk("allin", "All-in " + fmt(stack), "btn-raise");
  else if (legal.has("bet")) mk("bet", "Bet " + fmt(raiseTo), "btn-raise");
  else mk("raise", "Raise to " + fmt(raiseTo), "btn-raise");

  document.getElementById("log").innerHTML = (s.log || []).slice().reverse().map(l => `<div>${l}</div>`).join("");
  const banner = document.getElementById("winBanner");
  banner.innerHTML = s.done ? winnerBanner(s) : "";
}

function winnerBanner(s) {
  const winners = (s.players || []).filter(p => p.award > 0);
  if (!winners.length) return "";
  if (winners.length === 1) {
    const w = winners[0];
    const name = w.seat === s.hero ? "You" : w.id;
    const verb = w.seat === s.hero ? "win" : "wins";
    const sub = w.hand ? w.hand : (s.street === "Fold" ? "everyone folded" : "");
    return `${name} ${verb} ${fmt(w.award)}${sub ? `<span class="sub">${sub}</span>` : ""}`;
  }
  const names = winners.map(w => w.seat === s.hero ? "You" : w.id).join(" & ");
  const total = winners.reduce((a, p) => a + p.award, 0);
  return `Split pot  ${fmt(total)}<span class="sub">${names}</span>`;
}

function raiseLabel() {
  const raiseBtn = document.querySelector(".btn-raise");
  if (!raiseBtn || !state) return;
  const legal = new Set(state.legal || []);
  const stack = heroStack(state);
  const raiseTo = Number(document.getElementById("amount").value) || 0;
  const heroTurn = state.toAct === state.hero && !state.done;
  if (wantsAllIn(state, raiseTo)) {
    raiseBtn.textContent = "All-in " + fmt(stack);
    raiseBtn.disabled = !heroTurn || !legal.has("allin");
    raiseBtn.onclick = () => act("allin");
    return;
  }
  if (legal.has("bet")) {
    raiseBtn.textContent = "Bet " + fmt(raiseTo);
    raiseBtn.disabled = !heroTurn || !legal.has("bet");
    raiseBtn.onclick = () => act("bet");
  } else {
    raiseBtn.textContent = "Raise to " + fmt(raiseTo);
    raiseBtn.disabled = !heroTurn || !legal.has("raise");
    raiseBtn.onclick = () => act("raise");
  }
}
function setAmount(v) {
  document.getElementById("amount").value = v;
  document.getElementById("slider").value = v;
  raiseLabel();
}
document.getElementById("slider").oninput = (e) => {
  document.getElementById("amount").value = e.target.value;
  raiseLabel();
};
document.getElementById("amount").oninput = (e) => {
  document.getElementById("slider").value = e.target.value;
  raiseLabel();
};
document.querySelectorAll(".sizing .row button").forEach(b => {
  b.onclick = () => {
    if (!state) return;
    const legal = new Set(state.legal || []);
    const stack = heroStack(state);
    const pot = state.pot || 0;
    const min = Number(document.getElementById("slider").min) || 0;
    const cap = sizingMax(state);
    let v = min;
    if (b.dataset.size === "pot2") v = Math.max(min, Math.floor(pot / 2));
    if (b.dataset.size === "pot") v = Math.max(min, pot);
    if (b.dataset.size === "allin") {
      if (legal.has("allin") && state.toAct === state.hero && !state.done) {
        act("allin");
        return;
      }
      v = cap;
    }
    setAmount(Math.min(cap, Math.max(0, v)));
  };
});

let shownBoard = [];
let prevBoardN = 0;
let lastStreet = "";
let pending = null;
let animating = false;

function nextStreetLen(n) {
  if (n < 3) return 3;
  if (n < 4) return 4;
  if (n < 5) return 5;
  return 5;
}
function streetLabel(n) {
  if (n >= 5) return "River";
  if (n >= 4) return "Turn";
  if (n >= 3) return "Flop";
  return "Preflop";
}
function maskRunout(s, board) {
  return Object.assign({}, s, {
    board: board,
    street: streetLabel(board.length),
    done: false,
    legal: [],
    toAct: -1,
    players: (s.players || []).map(p => Object.assign({}, p, {
      award: 0,
      hand: "",
      hole: p.seat === s.hero ? p.hole : undefined
    }))
  });
}
function present(s) {
  clearTimeout(timer);
  if (!s || s.error) {
    render(s);
    return;
  }
  const target = s.board || [];
  const newHand = !s.done && target.length === 0 && (s.street === "Preflop" || !s.street);
  if (newHand) {
    shownBoard = [];
    prevBoardN = 0;
    lastStreet = s.street;
    pending = null;
    animating = false;
    render(s);
    schedule(s, false);
    return;
  }
  const have = shownBoard.length;
  if (target.length > nextStreetLen(have)) {
    animating = true;
    pending = s;
    const n = nextStreetLen(have);
    shownBoard = target.slice(0, n);
    render(maskRunout(s, shownBoard));
    timer = setTimeout(() => {
      animating = false;
      present(pending);
    }, n === 3 ? 1400 : 1100);
    return;
  }
  const streetBeat = target.length > have || (s.street && s.street !== lastStreet);
  shownBoard = target.slice();
  pending = null;
  animating = false;
  render(s);
  schedule(s, streetBeat);
  lastStreet = s.street;
}
function schedule(s, streetBeat) {
  clearTimeout(timer);
  if (!s || s.error || animating) return;
  if (s.done) {
    timer = setTimeout(() => {
      shownBoard = [];
      prevBoardN = 0;
      apply(jokerStep());
    }, 3200);
    return;
  }
  if (s.toAct >= 0 && s.toAct !== s.hero) {
    timer = setTimeout(() => apply(jokerStep()), streetBeat ? 1400 : 650);
  }
}
function apply(raw) { present(parse(raw)); }
function act(typ) {
  const chips = Number(document.getElementById("amount").value) || 0;
  apply(jokerAct(typ, chips));
}
document.getElementById("newGame").onclick = () => apply(jokerNewGame());
WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
  go.run(result.instance);
  apply(jokerNewGame());
});
